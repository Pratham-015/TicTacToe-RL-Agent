behaviors:
  Tic:
    trainer_type: ppo
    max_steps: 300000
    time_horizon: 16
    summary_freq: 1000
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 3.0e-4
      # learning_rate: 1.0e-7  # or even 0 if the version allows
      beta: 1.0e-4
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
